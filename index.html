                -webkit-font-smoothing: antialiased; }
            .staticrypt-content { min-height: 100%; }
            .staticrypt-page { max-width: 420px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 18vh) 20px 40px; }
            .staticrypt-title { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
            .staticrypt-bar { width: 56px; height: 5px; border-radius: 3px; background: #19b67f; margin: 12px 0 28px; }
            .staticrypt-instructions p:empty { display: none; }
            .staticrypt-instructions p { color: #a3a3a3; }
            .staticrypt-form { background: #212121; border-radius: 26px; padding: 20px; }
            .staticrypt-password-container { position: relative; background: #2a2a2a; border-radius: 14px; margin-bottom: 14px; }
            .staticrypt-form input[type="password"], .staticrypt-form input[type="text"] {
                width: 100%; background: transparent; border: 0; outline: 0; color: #fff;
                font-size: 17px; padding: 15px 48px 15px 16px; }
            .staticrypt-toggle-password-visibility { position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
                width: 20px; height: 20px; padding: 10px; opacity: .55; cursor: pointer; filter: invert(1); box-sizing: content-box; }
            label.staticrypt-remember { display: flex; align-items: center; gap: 12px; margin: 4px 2px 18px; color: #d0d0d0; font-size: 16px; }
            .staticrypt-remember input[type="checkbox"] { width: 20px; height: 20px; accent-color: #19b67f; margin: 0; }
            .staticrypt-form .staticrypt-decrypt-button { width: 100%; height: 52px; border: 0; border-radius: 18px;
                background: #19b67f; color: #06130d; font-size: 17px; font-weight: 600; cursor: pointer; -webkit-appearance: none; }
            .staticrypt-form .staticrypt-decrypt-button:active { filter: brightness(92%); }

            .staticrypt-spinner-container { height: 100%; display: flex; align-items: center; justify-content: center; }

            @keyframes spin { to { transform: rotate(360deg); } }
        </style>
